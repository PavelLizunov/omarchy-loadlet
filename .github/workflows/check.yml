name: Check

on:
  push:
    branches: [main, 'checkpoint/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check the distributed package before rebuilding it
        run: make check-package
      - name: Build and check native contracts
        run: make -B check-core
      - name: Check complete public history for diagnostic metadata
        run: PYTHONDONTWRITEBYTECODE=1 python3 test/publication-checks.py --public

  reproducible-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Official Arch base-devel 20261018.0.612668, immutable image identity.
    container: archlinux@sha256:a25b54cf4b9c0de8752f5417c81810fb41bbfa5cdd6a504a9b6816a3b86b1e59
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reproduce the shipped executable from this exact source
        shell: bash
        run: |
          set -euo pipefail
          pacman -Q gcc gcc-libs glibc binutils make
          test "$(g++ -dumpfullversion)" = 16.2.1
          cp activity-sampler "$RUNNER_TEMP/distributed-sampler"
          LC_ALL=C make -B activity-sampler
          cmp "$RUNNER_TEMP/distributed-sampler" activity-sampler
          sha256sum "$RUNNER_TEMP/distributed-sampler" activity-sampler

  native-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native host-compatible Qt
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Load pinned host source, without executing its scripts
        env:
          HOST_REV: 03ff1eff3812933f7088484533784d2f63eaf19a
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/omacom/omarchy.git "$RUNNER_TEMP/activity-host"
          git -C "$RUNNER_TEMP/activity-host" sparse-checkout set bin shell/Ui shell/Commons shell/plugins/bar
          git -C "$RUNNER_TEMP/activity-host" checkout --detach "$HOST_REV"
          test "$(git -C "$RUNNER_TEMP/activity-host" rev-parse HEAD)" = "$HOST_REV"
      - name: Actual QML consumer, inert I/O
        env:
          ACTIVITY_TEST_HOST: ${{ runner.temp }}/activity-host/shell
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: make check-ui
      - name: Native packaged installation without a compiler
        env:
          ACTIVITY_OMARCHY_BIN: ${{ runner.temp }}/activity-host/bin
        run: make check-install
